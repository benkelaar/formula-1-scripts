[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-alltime"
version = "0.1.0"
description = "Build a cached Formula 1 championship dataset for an all-time ranking animation."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
f1-alltime = "f1_alltime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_alltime"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

